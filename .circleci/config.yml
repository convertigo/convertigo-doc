version: 2.1
jobs:
  build:
    docker:
    - image: jekyll/jekyll:4
    working_directory: /srv/jekyll
    steps:
    - checkout
    - restore_cache:
        keys:
        - v1-bundle-{{ checksum "Gemfile" }}-{{ checksum ".circleci/config.yml" }}
        - v1-bundle-
    - run:
        name: Install dependencies
        command: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends s3cmd
          bundle install
    - run:
        name: Build documentation
        command: bundle exec jekyll build
    - save_cache:
        paths:
        - /usr/local/bundle
        key: v1-bundle-{{ checksum "Gemfile" }}-{{ checksum ".circleci/config.yml" }}
    - run:
        name: Copy documentation to the web server
        command: |
          export VERS=$(echo $CIRCLE_BRANCH | sed s,/,-,g)
          if [ "$VERS" = "master" ] ; then
            echo Pushing to -master- 
            s3cmd sync --no-mime-magic -P _site/* ${DESTINATION}/latest/
            export VERS=$(sed -n -E "s, +version: ([0-9]+.[0-9]+).*,\\1.x,p" _data/sidebars/c8o_sidebar.yml)
          fi
          echo Pushing to -${VERS}-
          s3cmd sync --no-mime-magic -P _site/* ${DESTINATION}/${VERS}/
  forward_master_manual_changes:
    docker:
    - image: cimg/base:stable
    working_directory: /home/circleci/repo
    steps:
    - add_ssh_keys:
        fingerprints:
        - "0f:4a:26:54:4c:1d:13:d5:4a:40:08:b8:35:a7:5d:34"
    - checkout
    - run:
        name: Forward master manual documentation changes
        command: |
          git config --global user.email "info@convertigo.com"
          git config --global user.name "$CIRCLE_PROJECT_USERNAME"
          if [ -n "${DOC_FLOW_GITHUB_TOKEN:-}" ]; then
            git remote set-url origin "https://x-access-token:${DOC_FLOW_GITHUB_TOKEN}@github.com/convertigo/convertigo-doc.git"
          fi
          DOC_FLOW_SOURCE_COMMIT="$CIRCLE_SHA1" .circleci/doc-flow.sh forward-master
workflows:
  version: 2
  all:
    jobs:
    - build
    - forward_master_manual_changes:
        requires:
        - build
        filters:
          branches:
            only: master
