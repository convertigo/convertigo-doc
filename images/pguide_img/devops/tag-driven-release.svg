<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="160" viewBox="0 0 1040 160" role="img" aria-labelledby="title desc">
  <title id="title">Tag-driven application release</title>
  <desc id="desc">Commit Version v2.3.0 with references pinned to tags, create and push tag v2.3.0, and run CI compilation and tests. Publish release v2.3.0 with CAR archives and a manifest only on success.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#44677b"/></marker></defs>
  <g fill="#eff6f9" stroke="#6e94a8" stroke-width="1.5">
    <rect x="8" y="30" width="240" height="100" rx="7"/>
    <rect x="289" y="30" width="210" height="100" rx="7"/>
    <rect x="540" y="30" width="200" height="100" rx="7"/>
    <rect x="818" y="30" width="214" height="100" rx="7" fill="#e8f5ee"/>
  </g>
  <g stroke="#44677b" stroke-width="2" marker-end="url(#arrow)"><path d="M248 80 H280"/><path d="M499 80 H531"/><path d="M740 80 H809"/></g>
  <g fill="#183d52" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">
    <text x="128" y="63">Commit Version v2.3.0</text><text x="128" y="95">References use tags</text>
    <text x="394" y="63">Create and push</text><text x="394" y="95">tag v2.3.0</text>
    <text x="640" y="63">CI: compile</text><text x="640" y="95">and test</text>
    <text x="779" y="65" font-size="14">success</text>
    <text x="925" y="63">Release v2.3.0</text><text x="925" y="95">.car and manifest</text>
  </g>
</svg>
